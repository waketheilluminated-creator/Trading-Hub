name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check JS entrypoints
        run: |
          set -euo pipefail
          # tools/example_out.js is a generated dump, not an entrypoint.
          for f in src/*.js tools/batch_convert.js tools/quick_test.js tools/debug_slice.js; do
            echo "node --check $f"
            node --check "$f"
          done
      - run: npm test

  studio-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replay + liq unit tests (no vinext build)
        working-directory: studio
        run: node --experimental-strip-types --test tests/replay.test.mjs tests/replay-keys.test.mjs tests/replay-icons.test.mjs tests/liq-auto-refresh.test.mjs tests/liq-refresh.test.mjs tests/liq-heatmap.test.mjs

  liq-h2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: H2 estimator unit + golden OOS
        run: |
          pip install pytest
          python -m pytest tools/liq-estimator/tests/test_h2.py -v
