name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check JS entrypoints
        run: |
          set -euo pipefail
          for f in src/*.js tools/*.js; do
            echo "node --check $f"
            node --check "$f"
          done
      - run: npm test
